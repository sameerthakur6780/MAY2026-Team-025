<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SmartBatch{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f8fa;padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border:1px solid #d0d7de;border-radius:6px;max-width:480px;">
          <tr>
            <td align="center" style="padding:32px 32px 20px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="40" height="40" style="width:40px;height:40px;background-color:#24292f;border-radius:8px;text-align:center;vertical-align:middle;">
                    <span style="display:block;color:#ffffff;font-size:18px;font-weight:700;line-height:40px;">S</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 32px 4px;">
              <h1 style="margin:0;font-size:20px;line-height:1.4;color:#1f2328;font-weight:600;">{% block heading %}{% endblock %}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 32px;color:#1f2328;font-size:14px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;">
              <hr style="border:none;border-top:1px solid #d0d7de;margin:0;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 32px 32px;color:#656d76;font-size:12px;line-height:1.6;">
              {% block footer %}This is an automated message from SmartBatch. Please do not reply directly to this email.{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
