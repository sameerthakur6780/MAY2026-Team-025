{% extends "email/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<p style="margin:0 0 20px;text-align:center;color:#1f2328;">Hi {{ recipient_name }},</p>
<div style="border:1px solid #d0d7de;border-radius:6px;padding:24px;text-align:left;margin:0 0 20px;">
  <p style="margin:0;white-space:pre-line;color:#1f2328;">{{ message }}</p>
</div>
{% if priority == "high" %}
<p style="margin:0;text-align:center;color:#cf222e;font-weight:600;">This announcement is marked urgent.</p>
{% endif %}
{% endblock %}
